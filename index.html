<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg:        #0e0e0e;
    --surface:   #161616;
    --surface2:  #1c1c1c;
    --border:    #2a2a2a;
    --text:      #ffffff;
    --muted:     #666666;
    --muted2:    #444444;
    --accent:    #ffffff;
    --green:     #4ade80;
    --red:       #f87171;
  }

  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    min-height: 100vh;
  }

  /* ── LAYOUT ── */
  .shell {
    display: flex;
    min-height: 100vh;
  }

  /* ── SIDEBAR ── */
  .sidebar {
    width: 64px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 0;
    gap: 32px;
    position: fixed;
    top: 0; left: 0; bottom: 0;
    z-index: 10;
  }

  .sidebar-icon {
    width: 36px; height: 36px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 10px;
    cursor: pointer;
    color: var(--muted);
    transition: color 0.2s, background 0.2s;
  }
  .sidebar-icon:hover { color: var(--text); background: var(--surface2); }
  .sidebar-icon.active { color: var(--text); }

  .sidebar-icon svg { width: 18px; height: 18px; }

  /* ── MAIN ── */
  .main {
    margin-left: 64px;
    flex: 1;
    display: flex;
    flex-direction: column;
  }

  /* ── TOPBAR ── */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 32px;
    border-bottom: 1px solid var(--border);
  }

  .topbar-title {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.15em;
    color: var(--muted);
    text-transform: uppercase;
  }

  .date-picker {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 12px;
    color: var(--muted);
    cursor: pointer;
    background: transparent;
    font-family: 'DM Sans', sans-serif;
  }

  .date-picker svg { width: 14px; height: 14px; }

  /* ── CONTENT ── */
  .content {
    padding: 32px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    max-width: 900px;
    width: 100%;
    margin: 0 auto;
  }

  /* ── TOTAL BALANCE CARD ── */
  .balance-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px 32px;
    position: relative;
    overflow: hidden;
  }

  .balance-label {
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 10px;
  }

  .balance-amount {
    font-size: 40px;
    font-weight: 300;
    letter-spacing: -0.02em;
    line-height: 1;
    margin-bottom: 10px;
    font-family: 'DM Mono', monospace;
  }

  .balance-change {
    font-size: 12px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .balance-change .pct {
    color: var(--green);
    font-weight: 500;
  }

  .balance-chart {
    position: absolute;
    right: 0; top: 0; bottom: 0;
    width: 55%;
    opacity: 0.6;
  }

  /* ── TWIN CARDS ── */
  .twin {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }

  .metric-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }

  .metric-left {}

  .metric-label {
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 10px;
  }

  .metric-amount {
    font-size: 26px;
    font-weight: 300;
    font-family: 'DM Mono', monospace;
    letter-spacing: -0.02em;
    margin-bottom: 8px;
  }

  .metric-change {
    font-size: 11px;
    color: var(--muted);
  }

  .metric-change .pct { font-weight: 500; }
  .metric-change .pct.up   { color: var(--green); }
  .metric-change .pct.down { color: var(--red); }

  /* ring */
  .ring-wrap {
    position: relative;
    width: 80px; height: 80px;
    flex-shrink: 0;
  }

  .ring-wrap canvas { width: 80px !important; height: 80px !important; }

  .ring-label {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
  }

  .ring-pct {
    font-size: 14px;
    font-weight: 500;
    font-family: 'DM Mono', monospace;
    display: block;
  }

  .ring-sub {
    font-size: 9px;
    color: var(--muted);
    display: block;
    margin-top: 1px;
  }

  /* ── OVERVIEW CHART ── */
  .overview-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px 28px;
  }

  .card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
  }

  .card-title {
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .period-select {
    font-size: 11px;
    color: var(--muted);
    background: transparent;
    border: none;
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .chart-area {
    height: 160px;
    position: relative;
  }

  /* ── SUMMARY ── */
  .summary-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px 28px;
  }

  .summary-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0;
  }

  .summary-col {
    padding: 0;
  }

  .summary-col:first-child {
    padding-right: 28px;
    border-right: 1px solid var(--border);
  }

  .summary-col:last-child {
    padding-left: 28px;
  }

  .summary-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 16px;
  }

  .summary-header-left {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .summary-icon {
    width: 28px; height: 28px;
    border: 1px solid var(--border);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    color: var(--muted);
  }

  .summary-icon svg { width: 12px; height: 12px; }

  .summary-type {
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .summary-total {
    font-size: 16px;
    font-weight: 400;
    font-family: 'DM Mono', monospace;
  }

  .summary-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
  }

  .summary-row:last-child { border-bottom: none; }

  .summary-row-name {
    font-size: 12px;
    color: var(--muted);
  }

  .summary-row-val {
    font-size: 12px;
    font-family: 'DM Mono', monospace;
    color: var(--text);
  }

  /* ── FOOTNOTE ── */
  .footnote {
    text-align: center;
    font-size: 11px;
    color: var(--muted2);
    padding: 8px 0 32px;
  }

  /* ── LOADING ── */
  .skeleton {
    background: linear-gradient(90deg, var(--surface2) 25%, var(--border) 50%, var(--surface2) 75%);
    background-size: 200% 100%;
    animation: shimmer 1.5s infinite;
    border-radius: 4px;
    height: 1em;
    display: inline-block;
    width: 100%;
  }

  @keyframes shimmer {
    0%   { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  /* ── TABS for currencies ── */
  .tabs {
    display: flex;
    gap: 4px;
  }

  .tab-btn {
    padding: 4px 10px;
    border-radius: 6px;
    font-size: 11px;
    background: transparent;
    border: 1px solid transparent;
    color: var(--muted);
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    transition: all 0.15s;
  }

  .tab-btn.active {
    border-color: var(--border);
    color: var(--text);
    background: var(--surface2);
  }

  /* mobile */
  @media (max-width: 600px) {
    .twin { grid-template-columns: 1fr; }
    .summary-grid { grid-template-columns: 1fr; }
    .summary-col:first-child { padding-right: 0; border-right: none; border-bottom: 1px solid var(--border); padding-bottom: 20px; margin-bottom: 20px; }
    .summary-col:last-child { padding-left: 0; }
    .balance-chart { display: none; }
    .content { padding: 20px 16px; }
    .topbar { padding: 16px 20px; }
    .main { margin-left: 0; }
    .sidebar { display: none; }
  }
</style>
</head>
<body>

<div class="shell">

  <!-- SIDEBAR -->
  <nav class="sidebar">
    <div class="sidebar-icon active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    </div>
    <div class="sidebar-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
    </div>
    <div class="sidebar-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
    </div>
    <div class="sidebar-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
    </div>
    <div class="sidebar-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
    </div>
    <div class="sidebar-icon" style="margin-top:auto;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 010 14.14M4.93 4.93a10 10 0 000 14.14"/></svg>
    </div>
  </nav>

  <div class="main">

    <!-- TOPBAR -->
    <div class="topbar">
      <span class="topbar-title">Dashboard</span>
      <button class="date-picker" id="date-label">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        <span id="date-range-text">Загрузка...</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="width:10px;height:10px"><polyline points="6 9 12 15 18 9"/></svg>
      </button>
    </div>

    <!-- CONTENT -->
    <div class="content">

      <!-- TOTAL BALANCE -->
      <div class="balance-card">
        <div class="balance-label">Total Balance</div>
        <div class="balance-amount" id="total-bal">—</div>
        <div class="balance-change">
          <span class="pct" id="bal-change">—</span>
          <span id="bal-change-label">за этот месяц</span>
        </div>
        <canvas class="balance-chart" id="line-mini"></canvas>
      </div>

      <!-- INCOME + EXPENSE -->
      <div class="twin">
        <div class="metric-card">
          <div class="metric-left">
            <div class="metric-label">Income</div>
            <div class="metric-amount" id="m-income">—</div>
            <div class="metric-change"><span class="pct up" id="m-income-cur">—</span></div>
          </div>
          <div class="ring-wrap">
            <canvas id="ring-income"></canvas>
            <div class="ring-label">
              <span class="ring-pct" id="ring-income-pct">—</span>
              <span class="ring-sub">of total</span>
            </div>
          </div>
        </div>

        <div class="metric-card">
          <div class="metric-left">
            <div class="metric-label">Expenses</div>
            <div class="metric-amount" id="m-expense">—</div>
            <div class="metric-change"><span class="pct down" id="m-expense-cur">—</span></div>
          </div>
          <div class="ring-wrap">
            <canvas id="ring-expense"></canvas>
            <div class="ring-label">
              <span class="ring-pct" id="ring-expense-pct">—</span>
              <span class="ring-sub">of total</span>
            </div>
          </div>
        </div>
      </div>

      <!-- OVERVIEW CHART -->
      <div class="overview-card">
        <div class="card-header">
          <span class="card-title">Overview</span>
          <div class="tabs">
            <button class="tab-btn active" onclick="setChartPeriod(3, this)">3M</button>
            <button class="tab-btn" onclick="setChartPeriod(6, this)">6M</button>
            <button class="tab-btn" onclick="setChartPeriod(12, this)">12M</button>
          </div>
        </div>
        <div class="chart-area">
          <canvas id="bar-chart"></canvas>
        </div>
      </div>

      <!-- SUMMARY -->
      <div class="summary-card">
        <div class="card-header">
          <span class="card-title">Summary</span>
        </div>
        <div class="summary-grid">
          <div class="summary-col">
            <div class="summary-header">
              <div class="summary-header-left">
                <div class="summary-icon">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><line x1="7" y1="17" x2="17" y2="7"/><polyline points="7 7 17 7 17 17"/></svg>
                </div>
                <span class="summary-type">Income</span>
              </div>
              <span class="summary-total" id="sum-income-total">—</span>
            </div>
            <div id="sum-income-rows"></div>
          </div>
          <div class="summary-col">
            <div class="summary-header">
              <div class="summary-header-left">
                <div class="summary-icon">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><line x1="7" y1="7" x2="17" y2="17"/><polyline points="17 7 17 17 7 17"/></svg>
                </div>
                <span class="summary-type">Expenses</span>
              </div>
              <span class="summary-total" id="sum-expense-total">—</span>
            </div>
            <div id="sum-expense-rows"></div>
          </div>
        </div>
      </div>

      <div class="footnote">All values are in EUR · Данные из Google Таблицы</div>
    </div>
  </div>
</div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbyppouk7LMv5oEq0yjzM6iJoteQtM4HavFMB3fRqfSmh_WsYF59kV0PS6goVegnN927/exec';

const CHART_COLORS = {
  white:   '#ffffff',
  muted:   '#444444',
  border:  '#2a2a2a',
  green:   '#4ade80',
  red:     '#f87171',
  surface: '#161616',
};

let barChartInstance = null;
let allMonthlyData   = {};
let chartPeriod      = 3;

// ── INIT ──
async function init() {
  updateDateLabel();
  await loadData();
}

function updateDateLabel() {
  const now   = new Date();
  const month = now.toLocaleString('ru', { month: 'long', year: 'numeric' });
  document.getElementById('date-range-text').textContent = month;
}

async function loadData() {
  try {
    const resp = await fetch(API_URL + '?action=getStats');
    const data = await resp.json();
    allMonthlyData = data.monthly || {};
    render(data);
  } catch(e) {
    console.error(e);
  }
}

// ── RENDER ──
function render(data) {
  const income  = data.income  || 0;
  const expense = data.expense || 0;
  const total   = income + expense;
  const balance = income - expense;

  const incPct = total ? Math.round(income  / total * 100) : 0;
  const expPct = total ? Math.round(expense / total * 100) : 0;

  // Balance
  document.getElementById('total-bal').textContent    = fmtEur(balance);
  document.getElementById('bal-change').textContent   = (balance >= 0 ? '+' : '') + fmtEur(balance);
  document.getElementById('bal-change-label').textContent = 'net this month';

  // Income card
  document.getElementById('m-income').textContent      = fmtEur(income);
  document.getElementById('m-income-cur').textContent  = '+ доходы';
  document.getElementById('ring-income-pct').textContent = incPct + '%';

  // Expense card
  document.getElementById('m-expense').textContent      = fmtEur(expense);
  document.getElementById('m-expense-cur').textContent  = '- расходы';
  document.getElementById('ring-expense-pct').textContent = expPct + '%';

  // Rings
  drawRing('ring-income',  incPct, CHART_COLORS.white);
  drawRing('ring-expense', expPct, CHART_COLORS.white);

  // Mini line
  drawMiniLine(data.monthly || {});

  // Bar chart
  drawBarChart(chartPeriod);

  // Summary — projects as income rows, categories as expense rows
  const projects  = data.byProject  || {};
  const cats      = data.byCategory || {};

  document.getElementById('sum-income-total').textContent  = fmtEur(income);
  document.getElementById('sum-expense-total').textContent = fmtEur(expense);

  const incRows = Object.entries(projects)
    .filter(([,v]) => v > 0)
    .sort(([,a],[,b]) => b - a)
    .slice(0, 4);

  const expRows = Object.entries(cats)
    .sort(([,a],[,b]) => b - a)
    .slice(0, 4);

  document.getElementById('sum-income-rows').innerHTML =
    incRows.map(([k,v]) => summaryRow(k, fmtEur(v))).join('') ||
    summaryRow('Нет данных', '—');

  document.getElementById('sum-expense-rows').innerHTML =
    expRows.map(([k,v]) => summaryRow(k, fmtEur(v))).join('') ||
    summaryRow('Нет данных', '—');
}

function summaryRow(name, val) {
  return `<div class="summary-row">
    <span class="summary-row-name">${name}</span>
    <span class="summary-row-val">${val}</span>
  </div>`;
}

// ── CHARTS ──
function drawRing(id, pct, color) {
  const canvas = document.getElementById(id);
  const ctx    = canvas.getContext('2d');
  new Chart(ctx, {
    type: 'doughnut',
    data: {
      datasets: [{
        data: [pct, 100 - pct],
        backgroundColor: [color, CHART_COLORS.border],
        borderWidth: 0,
        borderRadius: 4,
      }]
    },
    options: {
      cutout: '72%',
      responsive: false,
      plugins: { legend: { display: false }, tooltip: { enabled: false } },
      animation: { animateRotate: true, duration: 800 }
    }
  });
}

function drawMiniLine(monthly) {
  const canvas = document.getElementById('line-mini');
  const ctx    = canvas.getContext('2d');
  const months = Object.keys(monthly).slice(-8);
  const vals   = months.map(m => (monthly[m]?.income || 0) - (monthly[m]?.expense || 0));

  const grad = ctx.createLinearGradient(0, 0, canvas.width, 0);
  grad.addColorStop(0, 'rgba(255,255,255,0.03)');
  grad.addColorStop(1, 'rgba(255,255,255,0.18)');

  new Chart(ctx, {
    type: 'line',
    data: {
      labels: months,
      datasets: [{
        data: vals,
        borderColor: 'rgba(255,255,255,0.35)',
        borderWidth: 1.5,
        pointRadius: vals.map((_, i) => i === vals.length - 1 ? 4 : 0),
        pointBackgroundColor: '#fff',
        fill: true,
        backgroundColor: grad,
        tension: 0.4,
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { display: false }, tooltip: { enabled: false } },
      scales: { x: { display: false }, y: { display: false } },
      animation: { duration: 1000 }
    }
  });
}

function drawBarChart(months) {
  const keys   = Object.keys(allMonthlyData).slice(-months);
  const income  = keys.map(k => allMonthlyData[k]?.income  || 0);
  const expense = keys.map(k => allMonthlyData[k]?.expense || 0);

  if (barChartInstance) barChartInstance.destroy();

  const ctx = document.getElementById('bar-chart').getContext('2d');
  barChartInstance = new Chart(ctx, {
    type: 'line',
    data: {
      labels: keys,
      datasets: [
        {
          label: 'Доходы',
          data: income,
          borderColor: 'rgba(255,255,255,0.8)',
          borderWidth: 1.5,
          pointRadius: 3,
          pointBackgroundColor: '#fff',
          fill: false,
          tension: 0.4,
        },
        {
          label: 'Расходы',
          data: expense,
          borderColor: 'rgba(255,255,255,0.25)',
          borderWidth: 1.5,
          pointRadius: 3,
          pointBackgroundColor: 'rgba(255,255,255,0.4)',
          fill: false,
          tension: 0.4,
        }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: '#1c1c1c',
          borderColor: '#2a2a2a',
          borderWidth: 1,
          titleColor: '#666',
          bodyColor: '#fff',
          titleFont: { family: 'DM Sans', size: 10 },
          bodyFont:  { family: 'DM Mono', size: 12 },
          padding: 12,
          callbacks: {
            label: ctx => ' ' + fmtEur(ctx.parsed.y)
          }
        }
      },
      scales: {
        x: {
          ticks: { color: '#555', font: { family: 'DM Sans', size: 10 }, maxRotation: 0 },
          grid:  { color: '#1e1e1e' },
          border: { color: '#2a2a2a' }
        },
        y: {
          ticks: { color: '#555', font: { family: 'DM Mono', size: 10 }, callback: v => fmtShort(v) },
          grid:  { color: '#1e1e1e' },
          border: { color: '#2a2a2a' }
        }
      },
      animation: { duration: 600 }
    }
  });
}

function setChartPeriod(n, btn) {
  chartPeriod = n;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  drawBarChart(n);
}

// ── UTILS ──
function fmtEur(n) {
  const abs = Math.abs(Math.round(n));
  const str = abs.toLocaleString('ru');
  return (n < 0 ? '- ' : '') + '€ ' + str + '.00';
}

function fmtShort(n) {
  if (Math.abs(n) >= 1000) return '€' + (n/1000).toFixed(1) + 'k';
  return '€' + Math.round(n);
}

init();
</script>
</body>
</html>
